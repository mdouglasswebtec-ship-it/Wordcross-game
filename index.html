<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordcross Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Wordcross Game</h1>
        <div id="instructions">
            Find the hidden words in the crossword grid. Click a cell to select, then type your guess!
        </div>
        <div id="crossword"></div>
        <div id="input-section">
            <input type="text" id="word-input" maxlength="10" placeholder="Type a word...">
            <button id="submit-btn">Submit</button>
        </div>
        <div id="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
